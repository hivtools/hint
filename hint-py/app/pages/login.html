<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Login</title>
    <link rel="shortcut icon" href="/public/favicon.ico"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <!-- The front-end build writes app.css (a fixed name) for this page. See src/app/static/vite.config.ts. -->
    <link href="/public/css/app.css" rel="stylesheet">
    <!--
        The same file for everyone (served by app/routers/login.py). The script fills in what changes:
        - from GET /login/options: the title, and either the single sign-on button or (in development) a button for
          each dev user;
        - from this page's address: the message of an ended session (?error=SessionExpired&message=..., sent by the
          Vue app). It is put in as text (textContent), never as HTML.
    -->
    <script>
        function continueAsGuest() {
            sessionStorage.setItem("asGuest", "continueAsGuest")
        }

        function show(id) {
            document.getElementById(id).classList.remove("d-none")
        }

        function showSessionExpired() {
            const query = new URLSearchParams(window.location.search)
            if (query.get("error") === "SessionExpired") {
                const error = document.getElementById("error")
                error.textContent = query.get("message") || "Your session expired. Please log in again"
                error.classList.remove("d-none")
            }
        }

        async function showLoginOptions() {
            const response = await fetch("/login/options", {cache: "no-store"})
            const options = (await response.json()).data
            document.getElementById("app-title").textContent = options.title
            if (options.sso) {
                show("sso")
            }
            if (options.devUsers.length > 0) {
                const form = document.getElementById("dev-login-form")
                for (const user of options.devUsers) {
                    const button = document.createElement("button")
                    button.className = "btn btn-red w-100 mt-2 dev-login"
                    button.type = "submit"
                    button.name = "user"
                    button.value = user
                    button.textContent = "Log in as " + user
                    form.appendChild(button)
                }
                show("dev-login")
            }
            if (options.sso || options.devUsers.length > 0) {
                show("or")
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            showSessionExpired()
            showLoginOptions()
        })
    </script>
</head>
<body class="login-page m-0 p-0 h-100">
    <div id="container" class="d-flex flex-column vh-100">
        <a href="https://www.unaids.org" target="_blank"><img src="/public/images/unaids_logo.png" class="large-logo mt-4 mb-4 mx-auto d-flex"/></a>
        <h1 class="m-0 text-center"><strong id="app-title"></strong></h1>
        <div id="app" class="card login-form mx-auto mt-3">
            <div class="card-body mx-2">
                <div id="sso" class="d-none">
                    <div class="text-center mt-2">
                        <a id="sso-login" class="btn btn-red w-100" href="/oauth2">Log in with HIV Tools Single Sign-On account</a>
                    </div>
                    <div id="register-oauth2-account" class="text-muted text-center mt-2">
                        Don't have an account? <a href="/register" target="_blank">Create an account</a>
                    </div>
                </div>
                <div id="dev-login" class="d-none">
                    <!-- Development only (HINT_DEV_USERS): log in as one of these users, with no password -->
                    <h2 class="text-dark mb-3">Login</h2>
                    <form id="dev-login-form" method="post" action="/dev-login"></form>
                </div>
                <div id="error" class="alert alert-danger mt-2 d-none"></div>
                <div id="continue-as-guest" class="text-center mt-2">
                    <div id="or" class="text-divider d-none"><span class="text-muted">OR</span></div>
                    <a class="btn btn-red w-100" onclick="continueAsGuest()" href="/">Continue as guest</a>
                </div>
            </div>
        </div>
        <div></div>
        <div id="partners" class="text-center text-muted mt-5">Our partners</div>
        <div class="my-auto mx-5 d-flex flex-row flex-wrap justify-content-center align-items-center">
            <div class="small-logo m-4 d-flex">
                <a class="d-flex justify-content-center" href="https://www.fjelltopp.org" target="_blank">
                    <img src="/public/images/fjelltopp_logo.png" class="mw-100 mh-100">
                </a>
            </div>
            <div class="small-logo m-4 d-flex">
                <a class="d-flex justify-content-center" href="https://www.imperial.ac.uk" target="_blank">
                    <img src="/public/images/imperial_logo.png" class="mw-100 mh-100">
                </a>
            </div>
            <div class="small-logo m-4 d-flex">
                <a class="d-flex justify-content-center" href="https://github.com/reside-ic" target="_blank">
                    <img src="/public/images/reside_logo.png" class="mw-100 mh-100">
                </a>
            </div>
            <div class="small-logo m-4 d-flex">
                <a class="d-flex justify-content-center" href="https://www.avenirhealth.org" target="_blank">
                    <img src="/public/images/avenir_logo.png" class="mw-100 mh-100">
                </a>
            </div>
            <div class="small-logo m-4 d-flex">
                <a class="d-flex justify-content-center" href="https://www.washington.edu" target="_blank">
                    <img src="/public/images/uw_logo.png" class="mw-100 mh-100">
                </a>
            </div>
        </div>
        <div id="spacer" class="flex-grow-1"></div>
        <div class="links m-auto d-flex flex-row flex-wrap justify-content-between align-items-center pb-4">
            <a href="https://reside-ic.github.io/projects/naomi/" target="_blank">About</a>
            <a href="https://naomi.unaids.org/news" target="_blank">News</a>
            <a href="/privacy">Privacy</a>
            <a href="/accessibility">Accessibility</a>
        </div>
    </div>
</body>
</html>
