[project]
name = "hint-py"
version = "0.1.0"
description = "Backend API for naomi/hint web app"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.157.0",
    "opentelemetry-distro>=0.66b1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-cov",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
# Put the project root on sys.path so `from main import app` and `from dependencies import ...` resolve
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    "E501", # line length is left to the formatter
]

[tool.ruff.lint.isort]
# Our own top level modules. Listed explicitly because the editor runs ruff from the repo root, where `src` is not
# enough for it to see these as first party. Add new top level modules/packages (services, db, ...) here.
known-first-party = ["dependencies", "main", "routers"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert is how pytest tests work
