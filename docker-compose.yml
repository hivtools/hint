# Everything hint needs to run in development, except hint itself (Kotlin), which you run from your IDE or gradle.
#
#   docker compose up -d --wait                       postgres (migrated, with users), redis, hintr
#   docker compose --profile proxy up -d --wait       ... plus the Python API and the nginx proxy in front of
#                                                     Kotlin and Python
#
# scripts/dev.sh wraps this (creates the upload dirs, pins the hintr version, can also start Kotlin).
#
# Test users, all with password "password": test.user@example.com, naomi-support@imperial.ac.uk (plus the passwordless
# user "guest").

name: hint

services:
  db:
    image: ghcr.io/hivtools/hint-db:main
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # pg_isready reports ready too early for this image, see /hint-bin/wait-for-db
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'select 1' >/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 60

  db-migrate:
    image: ghcr.io/hivtools/hint-db-migrate:main
    command: ["-url=jdbc:postgresql://db/hint"]
    depends_on:
      db:
        condition: service_healthy

  db-users:
    image: ghcr.io/hivtools/hint-user-cli:main
    entrypoint:
      - sh
      - -c
      - |
        for user in "test.user@example.com password" "naomi-support@imperial.ac.uk password" "guest"; do
          sh /userCLI/bin/userCLI add-user $$user || true
        done
    configs:
      - source: user-cli-config
        target: /etc/hint/config.properties
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30

  hintr:
    # scripts/dev.sh sets this from src/config/hintr_version
    image: ghcr.io/hivtools/hintr:${HINTR_VERSION:-main}
    # hint sends hintr the path "<upload_dir>/<hash>" with upload_dir relative (config.properties: "uploads"), and hintr
    # runs in "/", so the folder is mounted at "/<name>". scripts/dev.sh gives a second stack (PORT_OFFSET) other names.
    command: ["--results-dir=/${RESULTS_NAME:-results}", "--inputs-dir=/${UPLOADS_NAME:-uploads}"]
    ports:
      - "${HINTR_PORT:-8888}:8888"
    volumes:
      - ./src/app/${UPLOADS_NAME:-uploads}:/${UPLOADS_NAME:-uploads}
      - ./src/app/${RESULTS_NAME:-results}:/${RESULTS_NAME:-results}
    environment:
      REDIS_URL: redis://redis:6379
      USE_MOCK_MODEL: "true"
    depends_on:
      redis:
        condition: service_healthy
      # Nothing needs the users here, but without this `up --wait` can return before they have been added
      db-users:
        condition: service_completed_successfully

  # ---- Migration to Python: only started with --profile proxy ----

  python:
    profiles: [proxy]
    build: ./hint-py
    # Not published to the host: the only way in is through the proxy, which sets the identity headers it trusts
    expose:
      - "8000"
    environment:
      HINT_DB_HOST: db
      # Through the recording and faulting proxy the contract tests put in front of hintr, like Kotlin's hintr_url.
      # It runs on the host (see ensure_stubs in scripts/dev.sh).
      HINT_HINTR_URL: http://host.docker.internal:${FAULT_PORT:-8882}
      # What hint tells hintr the uploaded files are called, as in Kotlin's upload_dir
      HINT_UPLOAD_DIR: ${UPLOADS_NAME:-uploads}
      # Where this container sees the results hintr writes. The path hintr gives for a result is relative to its own
      # results folder, so this is mounted at the same place as in hintr
      HINT_RESULTS_DIR: /${RESULTS_NAME:-results}
      # What the logs look like: "console" is one line for each message, "json" one object for each (for machines).
      # (Run by hand in a terminal, the API picks one itself: see HINT_LOG_FORMAT in hint-py/README.md.)
      HINT_LOG_FORMAT: ${HINT_LOG_FORMAT:-console}
      # OTEL=1 starts the API with opentelemetry-instrument, which sends its logs and traces to the `otel` service below
      OTEL_LAUNCHER: ${OTEL:+opentelemetry-instrument}
      OTEL_SERVICE_NAME: hint-py
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:18889
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hint-py:/app
      # Only read, never written
      - ./src/app/${RESULTS_NAME:-results}:/${RESULTS_NAME:-results}:ro
    # sh, so that OTEL_LAUNCHER (empty unless OTEL=1) can go in front of fastapi
    command: ["sh", "-c", "exec uv run --frozen --no-dev $${OTEL_LAUNCHER} fastapi dev app/main.py --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 1s
      retries: 60

  # Somewhere to see the logs and traces of the Python API (OpenTelemetry), with nothing to set up. Not started unless
  # asked for. scripts/dev.sh asks for it (and for the API to send to it) unless you run it with OTEL=0. By hand:
  # `OTEL=1 docker compose --profile proxy --profile otel up -d`, or `make otel-up` in hint-py (to use with
  # `make run-otel`). Then browse to http://localhost:18888. It keeps what it gets in memory only, and has no login, so
  # it only listens on this machine.
  otel:
    profiles: [otel]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "127.0.0.1:${OTEL_UI_PORT:-18888}:18888"   # the web page
      - "127.0.0.1:${OTEL_PORT:-4317}:18889"       # where an API on this machine sends (OTLP over gRPC)
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured

  # The front door, on the port Kotlin normally uses (application_url is http://localhost:8080) so that redirects
  # and cookies keep working. Kotlin has to be moved aside to KOTLIN_PORT.
  proxy:
    profiles: [proxy]
    build: ./proxy
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:80"
    environment:
      KOTLIN_UPSTREAM: host.docker.internal:${KOTLIN_PORT:-8081}
      PYTHON_UPSTREAM: python:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      python:
        condition: service_healthy

configs:
  user-cli-config:
    content: |
      db_url=jdbc:postgresql://db/hint
