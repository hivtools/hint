# Include in any `location` that is served by the Python API:
#
#     location /project/ { include snippets/python.conf; }
#
# The Python API logs users in and keeps the sessions (hint-py/app/services/web_sessions.py), so the browser's session
# cookie goes to it as it is, and nothing else is needed. The version the request works on is in X-Version-Id, which
# nginx passes on as it is too.
include snippets/proxy-common.conf;
proxy_pass http://python;
