# Include in any `location` that is served by the Python API:
#
#     location /items/ { include snippets/python.conf; }
#
# Authentication stays in Kotlin for now. Before a request is passed to Python, nginx asks Kotlin who the user is
# (see `location = /_whoami` in the server config), then hands the answer to Python in X-Hint-* headers. Python never
# sees the session cookie. proxy_set_header replaces any X-Hint-* header sent by the client, so they cannot be spoofed.
auth_request /_whoami;
auth_request_set $hint_user $upstream_http_x_hint_user;
auth_request_set $hint_version_id $upstream_http_x_hint_version_id;
# Kotlin sets a new session cookie when it sees a first time visitor, make sure that reaches the browser
auth_request_set $hint_set_cookie $upstream_http_set_cookie;
add_header Set-Cookie $hint_set_cookie always;

include snippets/proxy-common.conf;
proxy_set_header X-Hint-User $hint_user;
proxy_set_header X-Hint-Version-Id $hint_version_id;
proxy_pass http://python;
