# Include in a `location` that is served by the Python API and is for developers, not for the users of the app:
#
#     location ~ ^/model/debug/[^/]+$ { include snippets/python-github.conf; }
#
# The caller does not use the hint login. They send a GitHub token in the Authorization header, and Python lets them in
# only if the token's user is in a set GitHub team (`github_team_member` in hint-py/app/dependencies.py). nginx passes
# the Authorization header on as it is.
#
# A hint session must not take the place of the token, so the Cookie header is not sent: Python does not see the
# session cookie.
include snippets/proxy-common.conf;
proxy_set_header Cookie "";
proxy_pass http://python;
