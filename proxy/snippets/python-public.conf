# Include in a `location` that is served by the Python API and needs no user: the page of the Vue app and its built
# files (see hint-py/app/routers/pages.py).
#
#     location /public/ { include snippets/python-public.conf; }
#
# The Cookie header is not sent, so these requests never read or touch a session.
include snippets/proxy-common.conf;
proxy_set_header Cookie "";
proxy_pass http://python;
