# Include in a `location` that is served by the Python API and needs no user: the page of the Vue app and its built
# files (see hint-py/app/routers/pages.py).
#
#     location /public/ { include snippets/python-public.conf; }
#
# There is no auth_request, so Kotlin is not asked who the user is, and these requests cost it nothing. The page has
# nothing in it for one user: the app asks GET /me (which does ask Kotlin, and gets the visitor a session cookie).
# Python gets no hint identity: the X-Hint-* headers are set to empty, which nginx does not send, so a client cannot
# send its own either.
include snippets/proxy-common.conf;
proxy_set_header X-Hint-User "";
proxy_set_header X-Hint-Guest-Versions "";
proxy_set_header X-Hint-Access-Token "";
proxy_pass http://python;
