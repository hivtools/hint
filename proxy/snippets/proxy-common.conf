# Settings shared by every proxied location.
# This is a snippet because nginx drops ALL inherited proxy_set_header directives as soon as a location sets one of its
# own, so each location has to include this file rather than rely on the server block.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
