on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - "*"

name: Test ADR Front End

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Make shared env
              uses: ./.github/actions/make-shared-env
              with:
                ghcr-username: ${{ github.actor }}
                ghcr-password: ${{ secrets.GITHUB_TOKEN }}

            - name: Run deps
              run: scripts/run-dependencies.sh

            - name: Start Kotlin server
              run: scripts/run-kotlin-server.sh
              env:
                # The server makes the ADR calls, so it needs the header secret
                ADR_WAF_BYPASS_SECRET: ${{ secrets.ADR_WAF_BYPASS_SECRET }}

            - name: Test front end (ADR)
              run: npm run test:adr-integration --prefix=src/app/static
              env:
                ADR_TEST_KEY: ${{ secrets.ADR_TEST_KEY }}
