on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - "*"

name: Test Front End Integration

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Make shared env
              uses: ./.github/actions/make-shared-env
              with:
                ghcr-username: ${{ github.actor }}
                ghcr-password: ${{ secrets.GITHUB_TOKEN }}

            # scripts/dev.sh runs the stubs of the contract tests, in this environment
            - uses: ./.github/actions/setup-python-env
              with:
                working-directory: contract-tests

            - name: Build the front end
              run: npm run build --prefix=src/app/static && npm run copy --prefix=src/app/static

            # The dev stack: nginx on :8080 in front of the Python API, with hintr (mock model), postgres and redis
            - name: Start the dev stack
              run: scripts/dev.sh up
              env:
                OTEL: 0
                REAL_ADR: 0

            - name: Integration tests
              run: npm run test:integration --prefix=src/app/static

            - name: CodeCov
              run: |
                codecov -p . -f src/app/static/coverage/unit/*.json
                codecov -p . -f src/app/static/coverage/integration/*.json
              env:
                CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
