on:
  # Run any time any issue/PR has a new comment
  issue_comment:
    types: [created]

name: Update Snapshots

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    # This job will only run if the comment was on a pull requests and matches the slash command
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/update-snapshots'}}
    timeout-minutes: 60

    steps:
      - id: 'get-branch'
        run: echo "branch=$(gh pr view $PR_NO --repo $REPO --json headRefName --jq '.headRefName')" >> $GITHUB_OUTPUT
        env:
          REPO: ${{ github.repository }}
          PR_NO: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.get-branch.outputs.branch }}
          token: ${{ secrets.GH_ACTION_TOKEN }}

      - name: Make shared env
        uses: ./.github/actions/make-shared-env
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}

      # The whole dev stack, as in test-browser-e2e.yml: the app needs the Python API (it asks GET /me)
      - uses: ./.github/actions/setup-python-env
        with:
          working-directory: contract-tests

      - name: Build the front end
        run: npm run build --prefix=src/app/static && npm run copy --prefix=src/app/static

      - name: Start the dev stack
        run: scripts/dev.sh up
        env:
          OTEL: 0
          REAL_ADR: 0

      - name: Install playwright et al
        run: npx playwright install --with-deps --only-shell --no-progress chromium
        working-directory: src/app/static

      - name: Update snapshots
        run: |
          cd src/app/static
          npx playwright test --update-snapshots --reporter=list

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Update Snapshots
          file_pattern: '*.png'
