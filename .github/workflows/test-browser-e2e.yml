on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - "*"

name: Test Browser E2E

jobs:
    test:
        name: Test (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        runs-on: ubuntu-latest
        strategy:
            # Run all the shards to the end, so that the report has every failure.
            fail-fast: false
            matrix:
                shardIndex: [1, 2]
                shardTotal: [2]
        steps:
            - uses: actions/checkout@v4

            - name: Make shared env
              uses: ./.github/actions/make-shared-env
              with:
                ghcr-username: ${{ github.actor }}
                ghcr-password: ${{ secrets.GITHUB_TOKEN }}

            # scripts/dev.sh runs the stubs of the contract tests, in this environment
            - uses: ./.github/actions/setup-python-env
              with:
                working-directory: contract-tests

            # The Python API serves the page of the app and the built files (src/app/static/public)
            - name: Build the front end
              run: npm run build --prefix=src/app/static && npm run copy --prefix=src/app/static

            # The whole stack, as in development: nginx on :8080 in front of the Python API and Kotlin, with hintr
            # (mock model), postgres and redis. The app needs all of it: it asks the Python API who the user is
            # (GET /me) before it starts. The ADR stub, not the real dev ADR, which only accepts some IP addresses.
            - name: Start the dev stack
              run: scripts/dev.sh up
              env:
                OTEL: 0
                REAL_ADR: 0

            # Playwright itself comes from package-lock.json (make-shared-env
            # installs it). Here we install only the browser for that version.
            # The tests run headless, so the headless shell is enough.
            # The browser is not cached: the Playwright docs advise against
            # it, and the slow part is the system packages (fonts), which
            # apt installs and a cache of the browser does not include.
            - name: Install playwright et al
              run: npx playwright install --with-deps --only-shell --no-progress chromium
              working-directory: src/app/static

            - name: Test browser e2e
              run: npm run test:e2e --prefix=src/app/static -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

            - name: Save the logs of the dev stack
              if: ${{ failure() }}
              run: |
                  mkdir -p dev-logs
                  cp .dev/*.log dev-logs/ || true
                  docker compose -p hint --profile proxy logs --no-color > dev-logs/containers.log 2>&1 || true

            - name: Upload the logs of the dev stack
              uses: actions/upload-artifact@v4
              if: ${{ failure() }}
              with:
                name: dev-logs-${{ matrix.shardIndex }}
                path: dev-logs/
                retention-days: 7

            - name: Upload blob report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: blob-report-${{ matrix.shardIndex }}
                path: src/app/static/blob-report/
                if-no-files-found: 'ignore'
                retention-days: 1

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: test-results-${{ matrix.shardIndex }}
                path: src/app/static/test-results/
                if-no-files-found: 'ignore'
                retention-days: 7

    merge-reports:
        name: Merge reports
        # Merge the reports also when a shard fails: the report shows the failures.
        if: ${{ !cancelled() }}
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            # Only the lock file: it gives the Playwright version of the shards.
            - uses: actions/checkout@v4
              with:
                sparse-checkout: src/app/static/package-lock.json
                sparse-checkout-cone-mode: false

            - name: Download blob reports
              uses: actions/download-artifact@v4
              with:
                path: all-blob-reports
                pattern: blob-report-*
                merge-multiple: true

            # merge-reports must be the same Playwright version as the shards,
            # because it reads their blob reports. This job does no npm install:
            # it needs only the blob reports and the Node of the runner image.
            - name: Merge into HTML report
              run: |
                version=$(node -p "require('./src/app/static/package-lock.json').packages['node_modules/@playwright/test'].version")
                npx --yes "playwright@$version" merge-reports --reporter html ./all-blob-reports

            - name: Upload HTML report
              uses: actions/upload-artifact@v4
              with:
                name: playwright-report-attempt-${{ github.run_attempt }}
                path: playwright-report/
                retention-days: 7
