on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - "*"

name: Test Browser E2E

env:
    # The shards and the merge job must use the same Playwright version,
    # because merge-reports reads the blob reports of the shards.
    PLAYWRIGHT_VERSION: 1.49.1

jobs:
    test:
        name: Test (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        runs-on: ubuntu-latest
        strategy:
            # Run all the shards to the end, so that the report has every failure.
            fail-fast: false
            matrix:
                shardIndex: [1, 2]
                shardTotal: [2]
        steps:
            - uses: actions/checkout@v4

            - name: Make shared env
              uses: ./.github/actions/make-shared-env
              with:
                dh-username: ${{ secrets.DOCKERHUB_USERNAME }}
                dh-password: ${{ secrets.DOCKERHUB_TOKEN }}
                ghcr-username: ${{ github.actor }}
                ghcr-password: ${{ secrets.GITHUB_TOKEN }}

            - name: Run deps
              run: scripts/run-dependencies.sh

            - name: Start Kotlin server
              run: scripts/run-kotlin-server.sh

            - name: Install playwright et al
              run: |
                cd src/app/static
                npm install @playwright/test@${{ env.PLAYWRIGHT_VERSION }}
                npx playwright install chromium
                npx playwright install-deps chromium

            - name: Test browser e2e
              run: npm run browser-test --prefix=src/app/static -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

            - name: Upload blob report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: blob-report-${{ matrix.shardIndex }}
                path: src/app/static/blob-report/
                if-no-files-found: 'ignore'
                retention-days: 1

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: test-results-${{ matrix.shardIndex }}
                path: src/app/static/test-results/
                if-no-files-found: 'ignore'
                retention-days: 7

    merge-reports:
        name: Merge reports
        # Merge the reports also when a shard fails: the report shows the failures.
        if: ${{ !cancelled() }}
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - name: Download blob reports
              uses: actions/download-artifact@v4
              with:
                path: all-blob-reports
                pattern: blob-report-*
                merge-multiple: true

            # This job has no checkout and no npm install: merge-reports
            # needs only the blob reports and the Node of the runner image.
            - name: Merge into HTML report
              run: npx --yes playwright@${{ env.PLAYWRIGHT_VERSION }} merge-reports --reporter html ./all-blob-reports

            - name: Upload HTML report
              uses: actions/upload-artifact@v4
              with:
                name: playwright-report-attempt-${{ github.run_attempt }}
                path: playwright-report/
                retention-days: 7
